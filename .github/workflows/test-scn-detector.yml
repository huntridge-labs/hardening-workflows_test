  # --------------------------------------------------------------------------
  # S20: Delete operation — KMS key removal (2-commit: add then git rm)
  # Rule: resource 'aws_kms_key.*' operation 'delete'
  # --------------------------------------------------------------------------
  s20-delete-operation:
    name: "S20: delete operation (KMS key)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
