      - name: Verify outputs
        env:
          HAS_CHANGES: ${{ steps.scn.outputs.has_changes }}
          CATEGORY: ${{ steps.scn.outputs.change_category }}
          IMPACT: ${{ steps.scn.outputs.impact_count }}
        run: |
          echo "## S20: delete-operation" >> $GITHUB_STEP_SUMMARY
          echo "has_changes=$HAS_CHANGES category=$CATEGORY impact=$IMPACT" >> $GITHUB_STEP_SUMMARY
          FAILURES=0
          [ "$HAS_CHANGES" = "true" ] || { echo "FAIL: has_changes=$HAS_CHANGES"; FAILURES=$((FAILURES + 1)); }
          [ "$CATEGORY" = "IMPACT" ] || { echo "FAIL: category=$CATEGORY (expected IMPACT)"; FAILURES=$((FAILURES + 1)); }
          [ "${IMPACT:-0}" -ge 1 ] || { echo "FAIL: impact_count=$IMPACT"; FAILURES=$((FAILURES + 1)); }
          [ "$FAILURES" -eq 0 ] && echo "PASS: delete operation correctly classified"
          [ "$FAILURES" -eq 0 ] || exit 1

  # --------------------------------------------------------------------------
  # S21: K8s classification — version annotation (2-commit modify)
  # Rule: pattern 'kubernetes.io/.*version' → ADAPTIVE
  # --------------------------------------------------------------------------
  s21-k8s-classification:
    name: "S21: kubernetes classification"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create baseline then update version
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          mkdir -p k8s
          cat > k8s/versioned-deploy.yaml << 'FIXTURE'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: api-server
            labels:
              app.kubernetes.io/version: "1.0.0"
          spec:
            replicas: 3
            template:
              spec:
                containers:
                - name: api
                  image: api-server:1.0.0
          FIXTURE
          git add k8s/versioned-deploy.yaml
          git commit -m "test: baseline K8s deployment"

          cat > k8s/versioned-deploy.yaml << 'FIXTURE'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: api-server
            labels:
              app.kubernetes.io/version: "2.1.0"
          spec:
            replicas: 3
            template:
              spec:
                containers:
                - name: api
                  image: api-server:2.1.0
          FIXTURE
          git add k8s/versioned-deploy.yaml
          git commit -m "test: update K8s version annotation"

      - name: Run SCN detector
        id: scn
        uses: huntridge-labs/argus/.github/actions/scn-detector@sully/mcn-prototype
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          base_ref: 'HEAD~1'
          head_ref: 'HEAD'
          create_issues: false
          post_pr_comment: false
          enable_ai_fallback: false
          fail_on_category: 'none'

      - name: Verify outputs
        env:
          HAS_CHANGES: ${{ steps.scn.outputs.has_changes }}
          CATEGORY: ${{ steps.scn.outputs.change_category }}
          ADAPTIVE: ${{ steps.scn.outputs.adaptive_count }}
        run: |
          echo "## S21: k8s-classification" >> $GITHUB_STEP_SUMMARY
          echo "has_changes=$HAS_CHANGES category=$CATEGORY adaptive=$ADAPTIVE" >> $GITHUB_STEP_SUMMARY
          FAILURES=0
          [ "$HAS_CHANGES" = "true" ] || { echo "FAIL: has_changes=$HAS_CHANGES"; FAILURES=$((FAILURES + 1)); }
          [ "$CATEGORY" = "ADAPTIVE" ] || { echo "FAIL: category=$CATEGORY (expected ADAPTIVE)"; FAILURES=$((FAILURES + 1)); }
          [ "${ADAPTIVE:-0}" -ge 1 ] || { echo "FAIL: adaptive_count=$ADAPTIVE"; FAILURES=$((FAILURES + 1)); }
          [ "$FAILURES" -eq 0 ] && echo "PASS: K8s version annotation correctly classified"
          [ "$FAILURES" -eq 0 ] || exit 1

  # --------------------------------------------------------------------------
  # S22: CFN classification — tags on S3 bucket (single commit)
  # Rule: pattern 'tags.*' → ROUTINE
  # --------------------------------------------------------------------------
  s22-cfn-classification:
    name: "S22: cloudformation classification"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create CFN template with tags
        run: |
          mkdir -p cloudformation
          cat > cloudformation/tagged-bucket.yaml << 'FIXTURE'
          AWSTemplateFormatVersion: '2010-09-09'
          Description: S3 bucket with tags for classification test
          Resources:
            DataBucket:
              Type: AWS::S3::Bucket
              Properties:
                BucketName: scn-test-tagged-bucket
                Tags:
                  - Key: Environment
                    Value: staging
                  - Key: CostCenter
                    Value: engineering
          FIXTURE
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add cloudformation/tagged-bucket.yaml
          git commit -m "test: add CFN template with tags"

      - name: Run SCN detector
        id: scn
        uses: huntridge-labs/argus/.github/actions/scn-detector@sully/mcn-prototype
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          base_ref: 'HEAD~1'
          head_ref: 'HEAD'
          create_issues: false
          post_pr_comment: false
          enable_ai_fallback: false
          fail_on_category: 'none'

      - name: Verify outputs
        env:
          HAS_CHANGES: ${{ steps.scn.outputs.has_changes }}
          CATEGORY: ${{ steps.scn.outputs.change_category }}
          ROUTINE: ${{ steps.scn.outputs.routine_count }}
        run: |
          echo "## S22: cfn-classification" >> $GITHUB_STEP_SUMMARY
          echo "has_changes=$HAS_CHANGES category=$CATEGORY routine=$ROUTINE" >> $GITHUB_STEP_SUMMARY
          FAILURES=0
          [ "$HAS_CHANGES" = "true" ] || { echo "FAIL: has_changes=$HAS_CHANGES"; FAILURES=$((FAILURES + 1)); }
          [ "$CATEGORY" = "ROUTINE" ] || { echo "FAIL: category=$CATEGORY (expected ROUTINE)"; FAILURES=$((FAILURES + 1)); }
          [ "${ROUTINE:-0}" -ge 1 ] || { echo "FAIL: routine_count=$ROUTINE"; FAILURES=$((FAILURES + 1)); }
          [ "$FAILURES" -eq 0 ] && echo "PASS: CFN tags correctly classified as ROUTINE"
          [ "$FAILURES" -eq 0 ] || exit 1

  # --------------------------------------------------------------------------
  # S23: Custom config_file — overrides default profile
  # Uses custom profile that classifies aws_appconfig_application as TRANSFORMATIVE
  # (same resource is MANUAL_REVIEW with default profile in S17)
  # --------------------------------------------------------------------------
  s23-custom-config:
    name: "S23: custom config_file"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create IaC change (uses custom profile rule)
        run: |
          mkdir -p terraform
          cat > terraform/appconfig-custom.tf << 'FIXTURE'
          resource "aws_appconfig_application" "feature_flags" {
            name = "feature-flags-custom-profile"
          }
          FIXTURE
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add terraform/appconfig-custom.tf
          git commit -m "test: add appconfig for custom profile test"

      - name: Run SCN detector (custom profile)
        id: scn
        uses: huntridge-labs/argus/.github/actions/scn-detector@sully/mcn-prototype
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          base_ref: 'HEAD~1'
          head_ref: 'HEAD'
          config_file: 'tests/configs/custom-scn-profile.yml'
          create_issues: false
          post_pr_comment: false
          enable_ai_fallback: false
          fail_on_category: 'none'

      - name: Verify outputs
        env:
          HAS_CHANGES: ${{ steps.scn.outputs.has_changes }}
          CATEGORY: ${{ steps.scn.outputs.change_category }}
          TRANSFORMATIVE: ${{ steps.scn.outputs.transformative_count }}
        run: |
          echo "## S23: custom-config" >> $GITHUB_STEP_SUMMARY
          echo "has_changes=$HAS_CHANGES category=$CATEGORY transformative=$TRANSFORMATIVE" >> $GITHUB_STEP_SUMMARY
          FAILURES=0
          [ "$HAS_CHANGES" = "true" ] || { echo "FAIL: has_changes=$HAS_CHANGES"; FAILURES=$((FAILURES + 1)); }
          [ "$CATEGORY" = "TRANSFORMATIVE" ] || { echo "FAIL: category=$CATEGORY (expected TRANSFORMATIVE)"; FAILURES=$((FAILURES + 1)); }
          [ "${TRANSFORMATIVE:-0}" -ge 1 ] || { echo "FAIL: transformative_count=$TRANSFORMATIVE"; FAILURES=$((FAILURES + 1)); }
          [ "$FAILURES" -eq 0 ] && echo "PASS: custom config_file correctly classified"
          [ "$FAILURES" -eq 0 ] || exit 1

  # --------------------------------------------------------------------------
  # S24: Single-file multi-resource — two resources in one .tf file
  # Rules: transformative 'aws_iam_role.*' create + impact 'aws_security_group.*' 0.0.0.0/0
  # Validates per-resource extraction from a single file
  # NOTE: Avoids tags/description attrs to prevent routine rule cross-match
  #       due to extract_changed_attributes 1000-char shared window.
  # --------------------------------------------------------------------------
  s24-single-file-multi-resource:
    name: "S24: single-file multi-resource"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create single file with multiple resources
        run: |
          mkdir -p terraform
          cat > terraform/mixed-resources.tf << 'FIXTURE'
          resource "aws_iam_role" "service_role" {
            name               = "test-role"
            assume_role_policy = "{}"
          }

          resource "aws_security_group" "wide_open" {
            name = "wide-open-sg"
            ingress {
              cidr_blocks = ["0.0.0.0/0"]
              from_port   = 22
              to_port     = 22
              protocol    = "tcp"
            }
          }
          FIXTURE
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add terraform/mixed-resources.tf
          git commit -m "test: add single file with transformative + impact resources"

      - name: Run SCN detector
        id: scn
        uses: huntridge-labs/argus/.github/actions/scn-detector@sully/mcn-prototype
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          base_ref: 'HEAD~1'
          head_ref: 'HEAD'
          create_issues: false
          post_pr_comment: false
          enable_ai_fallback: false
          fail_on_category: 'none'

      - name: Verify outputs
        env:
          HAS_CHANGES: ${{ steps.scn.outputs.has_changes }}
          CATEGORY: ${{ steps.scn.outputs.change_category }}
          TRANSFORMATIVE: ${{ steps.scn.outputs.transformative_count }}
          IMPACT: ${{ steps.scn.outputs.impact_count }}
        run: |
          echo "## S24: single-file-multi-resource" >> $GITHUB_STEP_SUMMARY
          echo "has_changes=$HAS_CHANGES category=$CATEGORY transformative=$TRANSFORMATIVE impact=$IMPACT" >> $GITHUB_STEP_SUMMARY
          FAILURES=0
          [ "$HAS_CHANGES" = "true" ] || { echo "FAIL: has_changes=$HAS_CHANGES"; FAILURES=$((FAILURES + 1)); }
          [ "$CATEGORY" = "IMPACT" ] || { echo "FAIL: category=$CATEGORY (expected IMPACT)"; FAILURES=$((FAILURES + 1)); }
          [ "${TRANSFORMATIVE:-0}" -ge 1 ] || { echo "FAIL: transformative_count=$TRANSFORMATIVE (expected >=1)"; FAILURES=$((FAILURES + 1)); }
          [ "${IMPACT:-0}" -ge 1 ] || { echo "FAIL: impact_count=$IMPACT (expected >=1)"; FAILURES=$((FAILURES + 1)); }
          [ "$FAILURES" -eq 0 ] && echo "PASS: single-file multi-resource correctly classified"
          [ "$FAILURES" -eq 0 ] || exit 1

  # ==========================================================================
  # Validate results + build JSON output for dashboard
  # ==========================================================================
  validate-results:
    name: "Validate SCN results"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - s1-routine-tags
      - s2-routine-description
      - s3-adaptive-instance-type
      - s4-adaptive-iam-attachment
      - s5-transformative-iam-role
      - s6-transformative-db-engine
      - s7-impact-encryption
      - s8-impact-public-sg
      - s9-impact-iam-user
      - s10-kubernetes-detection
      - s11-cloudformation-detection
      - s12-no-iac-changes
      - s13-fail-on-impact
      - s14-fail-on-adaptive
      - s15-mixed-multi-category
      - s16-dry-run-issues
      - s17-manual-review
      - s18-fail-on-transformative
      - s19-fail-on-category-pass
      - s20-delete-operation
      - s21-k8s-classification
      - s22-cfn-classification
      - s23-custom-config
      - s24-single-file-multi-resource
    if: always()
    outputs:
      results: ${{ steps.collect.outputs.results }}
    steps:
      - name: Validate test outcomes
        env:
          S1: ${{ needs.s1-routine-tags.result }}
          S2: ${{ needs.s2-routine-description.result }}
          S3: ${{ needs.s3-adaptive-instance-type.result }}
          S4: ${{ needs.s4-adaptive-iam-attachment.result }}
          S5: ${{ needs.s5-transformative-iam-role.result }}
          S6: ${{ needs.s6-transformative-db-engine.result }}
          S7: ${{ needs.s7-impact-encryption.result }}
          S8: ${{ needs.s8-impact-public-sg.result }}
          S9: ${{ needs.s9-impact-iam-user.result }}
          S10: ${{ needs.s10-kubernetes-detection.result }}
          S11: ${{ needs.s11-cloudformation-detection.result }}
          S12: ${{ needs.s12-no-iac-changes.result }}
          S13: ${{ needs.s13-fail-on-impact.result }}
          S14: ${{ needs.s14-fail-on-adaptive.result }}
          S15: ${{ needs.s15-mixed-multi-category.result }}
          S16: ${{ needs.s16-dry-run-issues.result }}
          S17: ${{ needs.s17-manual-review.result }}
          S18: ${{ needs.s18-fail-on-transformative.result }}
          S19: ${{ needs.s19-fail-on-category-pass.result }}
          S20: ${{ needs.s20-delete-operation.result }}
          S21: ${{ needs.s21-k8s-classification.result }}
          S22: ${{ needs.s22-cfn-classification.result }}
          S23: ${{ needs.s23-custom-config.result }}
          S24: ${{ needs.s24-single-file-multi-resource.result }}
        run: |
          FAILURES=0

          check() {
            local name="$1" got="$2" expected="$3"
            if [ "$got" = "$expected" ]; then
              echo "PASS $name: $got (expected $expected)"
            else
              echo "FAIL $name: $got (expected $expected)"
              FAILURES=$((FAILURES + 1))
            fi
          }

          echo "============================================"
          echo "SCN Detector Test Validation"
          echo "============================================"
          echo ""

          check "S1  routine-tags" "$S1" "success"
          check "S2  routine-description" "$S2" "success"
          check "S3  adaptive-instance-type" "$S3" "success"
          check "S4  adaptive-iam-attachment" "$S4" "success"
          check "S5  transformative-iam-role" "$S5" "success"
          check "S6  transformative-db-engine" "$S6" "success"
          check "S7  impact-encryption" "$S7" "success"
          check "S8  impact-public-sg" "$S8" "success"
          check "S9  impact-iam-user" "$S9" "success"
          check "S10 kubernetes-detection" "$S10" "success"
          check "S11 cloudformation-detection" "$S11" "success"
          check "S12 no-iac-changes" "$S12" "success"
          check "S13 fail-on-impact" "$S13" "success"
          check "S14 fail-on-adaptive" "$S14" "success"
          check "S15 mixed-multi-category" "$S15" "success"
          check "S16 dry-run-issues" "$S16" "success"
          check "S17 manual-review" "$S17" "success"
          check "S18 fail-on-transformative" "$S18" "success"
          check "S19 fail-on-category-pass" "$S19" "success"
          check "S20 delete-operation" "$S20" "success"
          check "S21 k8s-classification" "$S21" "success"
          check "S22 cfn-classification" "$S22" "success"
          check "S23 custom-config" "$S23" "success"
          check "S24 single-file-multi-resource" "$S24" "success"

          echo ""
          echo "============================================"
          TOTAL=24
          PASSED=$((TOTAL - FAILURES))
          echo "Results: $PASSED/$TOTAL passed"
          echo "============================================"

          if [ "$FAILURES" -gt 0 ]; then
            echo "::error::$FAILURES SCN detector test(s) did not produce expected outcome"
            exit 1
          fi

      - name: Build results JSON
        id: collect
        if: always()
        env:
          S1: ${{ needs.s1-routine-tags.result }}
          S2: ${{ needs.s2-routine-description.result }}
          S3: ${{ needs.s3-adaptive-instance-type.result }}
          S4: ${{ needs.s4-adaptive-iam-attachment.result }}
          S5: ${{ needs.s5-transformative-iam-role.result }}
          S6: ${{ needs.s6-transformative-db-engine.result }}
          S7: ${{ needs.s7-impact-encryption.result }}
          S8: ${{ needs.s8-impact-public-sg.result }}
          S9: ${{ needs.s9-impact-iam-user.result }}
          S10: ${{ needs.s10-kubernetes-detection.result }}
          S11: ${{ needs.s11-cloudformation-detection.result }}
          S12: ${{ needs.s12-no-iac-changes.result }}
          S13: ${{ needs.s13-fail-on-impact.result }}
          S14: ${{ needs.s14-fail-on-adaptive.result }}
          S15: ${{ needs.s15-mixed-multi-category.result }}
          S16: ${{ needs.s16-dry-run-issues.result }}
          S17: ${{ needs.s17-manual-review.result }}
          S18: ${{ needs.s18-fail-on-transformative.result }}
          S19: ${{ needs.s19-fail-on-category-pass.result }}
          S20: ${{ needs.s20-delete-operation.result }}
          S21: ${{ needs.s21-k8s-classification.result }}
          S22: ${{ needs.s22-cfn-classification.result }}
          S23: ${{ needs.s23-custom-config.result }}
          S24: ${{ needs.s24-single-file-multi-resource.result }}
        run: |
          to_status() {
            local got="$1" expected="$2"
            case "$got" in
              skipped) echo "skip" ;;
              cancelled) echo "cancel" ;;
              *)
                if [ "$got" = "$expected" ]; then
                  echo "pass"
                else
                  echo "FAIL"
                fi
                ;;
            esac
          }

          RESULTS=$(jq -n -c \
            --arg s1 "$(to_status "$S1" success)" \
            --arg s2 "$(to_status "$S2" success)" \
            --arg s3 "$(to_status "$S3" success)" \
            --arg s4 "$(to_status "$S4" success)" \
            --arg s5 "$(to_status "$S5" success)" \
            --arg s6 "$(to_status "$S6" success)" \
            --arg s7 "$(to_status "$S7" success)" \
            --arg s8 "$(to_status "$S8" success)" \
            --arg s9 "$(to_status "$S9" success)" \
            --arg s10 "$(to_status "$S10" success)" \
            --arg s11 "$(to_status "$S11" success)" \
            --arg s12 "$(to_status "$S12" success)" \
            --arg s13 "$(to_status "$S13" success)" \
            --arg s14 "$(to_status "$S14" success)" \
            --arg s15 "$(to_status "$S15" success)" \
            --arg s16 "$(to_status "$S16" success)" \
            --arg s17 "$(to_status "$S17" success)" \
            --arg s18 "$(to_status "$S18" success)" \
            --arg s19 "$(to_status "$S19" success)" \
            --arg s20 "$(to_status "$S20" success)" \
            --arg s21 "$(to_status "$S21" success)" \
            --arg s22 "$(to_status "$S22" success)" \
            --arg s23 "$(to_status "$S23" success)" \
            --arg s24 "$(to_status "$S24" success)" \
            '[
              {"id":"S1","name":"routine tags","detail":"Terraform tags.* pattern — ROUTINE classification","status":$s1},
              {"id":"S2","name":"routine description","detail":"Terraform description pattern — ROUTINE classification","status":$s2},
              {"id":"S3","name":"adaptive instance type","detail":"aws_instance instance_type modify — ADAPTIVE classification","status":$s3},
              {"id":"S4","name":"adaptive IAM attachment","detail":"aws_iam_policy_attachment create — ADAPTIVE classification","status":$s4},
              {"id":"S5","name":"transformative IAM role","detail":"aws_iam_role create — TRANSFORMATIVE classification","status":$s5},
              {"id":"S6","name":"transformative DB engine","detail":"aws_rds_cluster engine modify — TRANSFORMATIVE classification","status":$s6},
              {"id":"S7","name":"impact encryption","detail":"S3 encryption removal — IMPACT classification","status":$s7},
              {"id":"S8","name":"impact public SG","detail":"Security group 0.0.0.0/0 ingress — IMPACT classification","status":$s8},
              {"id":"S9","name":"impact IAM user","detail":"aws_iam_user create — IMPACT classification","status":$s9},
              {"id":"S10","name":"kubernetes detection","detail":"K8s Deployment YAML — IaC format detection","status":$s10},
              {"id":"S11","name":"cloudformation detection","detail":"CFN template YAML — IaC format detection","status":$s11},
              {"id":"S12","name":"no IaC changes","detail":"Non-IaC file — has_changes=false","status":$s12},
              {"id":"S13","name":"fail on impact","detail":"fail_on_category=impact — enforcement","status":$s13},
              {"id":"S14","name":"fail on adaptive","detail":"fail_on_category=adaptive — enforcement","status":$s14},
              {"id":"S15","name":"mixed multi-category","detail":"Routine + Impact files — highest category wins","status":$s15},
              {"id":"S16","name":"dry-run issues","detail":"Dry-run mode — issue payloads without API calls","status":$s16},
              {"id":"S17","name":"manual review","detail":"Unmatched resource — MANUAL_REVIEW classification","status":$s17},
              {"id":"S18","name":"fail on transformative","detail":"fail_on_category=transformative — enforcement","status":$s18},
              {"id":"S19","name":"fail on category pass","detail":"fail_on_category=adaptive with ROUTINE — no failure","status":$s19},
              {"id":"S20","name":"delete operation","detail":"aws_kms_key file deletion — IMPACT classification","status":$s20},
              {"id":"S21","name":"k8s classification","detail":"K8s version annotation — ADAPTIVE classification","status":$s21},
              {"id":"S22","name":"cfn classification","detail":"CFN S3 bucket tags — ROUTINE classification","status":$s22},
              {"id":"S23","name":"custom config","detail":"Custom config_file — overrides default profile","status":$s23},
              {"id":"S24","name":"single-file multi-resource","detail":"Two resources in one .tf — per-resource extraction","status":$s24}
            ]')
          echo "results=$RESULTS" >> "$GITHUB_OUTPUT"
