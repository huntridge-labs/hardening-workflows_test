  # --------------------------------------------------------------------------
  # S15: Mixed multi-category — highest wins (single commit, multi-file)
  # Creates routine (tags) + impact (public SG) files, expects IMPACT as highest
  # --------------------------------------------------------------------------
  s15-mixed-multi-category:
    name: "S15: mixed multi-category"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create mixed IaC changes
        run: |
          mkdir -p terraform
          cat > terraform/tags.tf << 'FIXTURE'
          resource "aws_instance" "web" {
            instance_type = "t3.small"

            tags = {
              Name = "mixed-test"
            }
          }
          FIXTURE

          cat > terraform/security-group.tf << 'FIXTURE'
          resource "aws_security_group" "public" {
            ingress {
              cidr_blocks = ["0.0.0.0/0"]
              from_port   = 80
              to_port     = 80
              protocol    = "tcp"
            }
          }
          FIXTURE

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add terraform/tags.tf terraform/security-group.tf
          git commit -m "test: add mixed routine + impact changes"

      - name: Run SCN detector
        id: scn
        uses: huntridge-labs/argus/.github/actions/scn-detector@sully/mcn-prototype
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          base_ref: 'HEAD~1'
          head_ref: 'HEAD'
          create_issues: false
          post_pr_comment: false
          enable_ai_fallback: false
          fail_on_category: 'none'

      - name: Verify outputs
        env:
          HAS_CHANGES: ${{ steps.scn.outputs.has_changes }}
          CATEGORY: ${{ steps.scn.outputs.change_category }}
          ROUTINE: ${{ steps.scn.outputs.routine_count }}
          IMPACT: ${{ steps.scn.outputs.impact_count }}
        run: |
          echo "## S15: mixed-multi-category" >> $GITHUB_STEP_SUMMARY
          echo "has_changes=$HAS_CHANGES category=$CATEGORY routine=$ROUTINE impact=$IMPACT" >> $GITHUB_STEP_SUMMARY
          FAILURES=0
          [ "$HAS_CHANGES" = "true" ] || { echo "FAIL: has_changes=$HAS_CHANGES"; FAILURES=$((FAILURES + 1)); }
          [ "$CATEGORY" = "IMPACT" ] || { echo "FAIL: category=$CATEGORY (expected IMPACT)"; FAILURES=$((FAILURES + 1)); }
          [ "${ROUTINE:-0}" -ge 1 ] || { echo "FAIL: routine_count=$ROUTINE (expected >=1)"; FAILURES=$((FAILURES + 1)); }
          [ "${IMPACT:-0}" -ge 1 ] || { echo "FAIL: impact_count=$IMPACT (expected >=1)"; FAILURES=$((FAILURES + 1)); }
          [ "$FAILURES" -eq 0 ] && echo "PASS: all assertions met"
          [ "$FAILURES" -eq 0 ] || exit 1

  # --------------------------------------------------------------------------
  # S16: Dry-run mode — issue payloads generated without API calls
  # Uses same fixture as S4 (ADAPTIVE), with dry_run=true and create_issues=true
  # --------------------------------------------------------------------------
  s16-dry-run-issues:
    name: "S16: dry-run issue creation"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create test IaC changes
        run: |
          mkdir -p terraform
          cat > terraform/iam-attach.tf << 'FIXTURE'
          resource "aws_iam_policy_attachment" "app_attach" {
            name       = "app-policy-attachment"
            roles      = ["app-role"]
            policy_arn = "arn:aws:iam::policy/ReadOnlyAccess"
          }
          FIXTURE
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add terraform/iam-attach.tf
          git commit -m "test: add IAM attachment for dry-run test"

      - name: Run SCN detector (dry-run)
        id: scn
        uses: huntridge-labs/argus/.github/actions/scn-detector@sully/mcn-prototype
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          base_ref: 'HEAD~1'
          head_ref: 'HEAD'
          create_issues: true
          post_pr_comment: true
          enable_ai_fallback: false
          fail_on_category: 'none'
          dry_run: true

      - name: Verify dry-run outputs
        env:
          HAS_CHANGES: ${{ steps.scn.outputs.has_changes }}
          CATEGORY: ${{ steps.scn.outputs.change_category }}
        run: |
          echo "## S16: dry-run-issues" >> $GITHUB_STEP_SUMMARY
          FAILURES=0

          # Should still detect changes
          [ "$HAS_CHANGES" = "true" ] || { echo "FAIL: has_changes=$HAS_CHANGES"; FAILURES=$((FAILURES + 1)); }
          [ "$CATEGORY" = "ADAPTIVE" ] || { echo "FAIL: category=$CATEGORY (expected ADAPTIVE)"; FAILURES=$((FAILURES + 1)); }

          # Dry-run JSON should exist with correct structure
          if [ -f scn-reports/dry-run-issues.json ]; then
            echo "dry-run-issues.json found"
            TOTAL=$(python3 -c "import json; d=json.load(open('scn-reports/dry-run-issues.json')); print(d['total'])")
            IS_DRY_RUN=$(python3 -c "import json; d=json.load(open('scn-reports/dry-run-issues.json')); print(d['dry_run'])")
            [ "$IS_DRY_RUN" = "True" ] || { echo "FAIL: dry_run flag not set"; FAILURES=$((FAILURES + 1)); }
            [ "$TOTAL" -ge 1 ] || { echo "FAIL: total=$TOTAL (expected >=1)"; FAILURES=$((FAILURES + 1)); }
          else
            echo "FAIL: scn-reports/dry-run-issues.json not found"
            FAILURES=$((FAILURES + 1))
          fi

          # PR comment report should exist (written by report generator)
          [ -f scn-summaries/scn-report.md ] || { echo "FAIL: scn-report.md not found"; FAILURES=$((FAILURES + 1)); }

          [ "$FAILURES" -eq 0 ] && echo "PASS: all dry-run assertions met"
          [ "$FAILURES" -eq 0 ] || exit 1

  # --------------------------------------------------------------------------
  # S17: MANUAL_REVIEW — unmatched resource triggers manual review
  # Uses a Terraform resource that doesn't match any rule in the default profile
  # --------------------------------------------------------------------------
  s17-manual-review:
    name: "S17: manual review detection"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create unmatched IaC change
        run: |
          mkdir -p terraform
          cat > terraform/appconfig.tf << 'FIXTURE'
          resource "aws_appconfig_application" "flags" {
            name = "feature-flags-app"
          }
          FIXTURE
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add terraform/appconfig.tf
          git commit -m "test: add unmatched resource for manual review"

      - name: Run SCN detector (dry-run)
        id: scn
        uses: huntridge-labs/argus/.github/actions/scn-detector@sully/mcn-prototype
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          base_ref: 'HEAD~1'
          head_ref: 'HEAD'
          create_issues: true
          post_pr_comment: false
          enable_ai_fallback: false
          fail_on_category: 'none'
          dry_run: true

      - name: Verify manual review classification
        env:
          HAS_CHANGES: ${{ steps.scn.outputs.has_changes }}
          CATEGORY: ${{ steps.scn.outputs.change_category }}
          MANUAL_REVIEW: ${{ steps.scn.outputs.manual_review_count }}
        run: |
          echo "## S17: manual-review" >> $GITHUB_STEP_SUMMARY
          echo "has_changes=$HAS_CHANGES category=$CATEGORY manual_review=$MANUAL_REVIEW" >> $GITHUB_STEP_SUMMARY
          FAILURES=0

          [ "$HAS_CHANGES" = "true" ] || { echo "FAIL: has_changes=$HAS_CHANGES"; FAILURES=$((FAILURES + 1)); }
          [ "${MANUAL_REVIEW:-0}" -ge 1 ] || { echo "FAIL: manual_review_count=$MANUAL_REVIEW (expected >=1)"; FAILURES=$((FAILURES + 1)); }

          # Dry-run JSON should NOT contain MANUAL_REVIEW issues (not merging to default branch)
          if [ -f scn-reports/dry-run-issues.json ]; then
            MR_COUNT=$(python3 -c "
          import json
          d = json.load(open('scn-reports/dry-run-issues.json'))
          mr = [i for i in d.get('issues', []) if i.get('category') == 'MANUAL_REVIEW']
          print(len(mr))
          ")
            [ "$MR_COUNT" -eq 0 ] || { echo "FAIL: MANUAL_REVIEW issues=$MR_COUNT (expected 0 — not merging to default)"; FAILURES=$((FAILURES + 1)); }
          fi

          [ "$FAILURES" -eq 0 ] && echo "PASS: manual review correctly detected"
          [ "$FAILURES" -eq 0 ] || exit 1

  # --------------------------------------------------------------------------
