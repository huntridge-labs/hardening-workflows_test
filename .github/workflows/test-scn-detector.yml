          [ "$FAILURES" -eq 0 ] && echo "PASS: fail_on_category=transformative correctly triggered failure"
          [ "$FAILURES" -eq 0 ] || exit 1

  # --------------------------------------------------------------------------
  # S19: fail_on_category negative — ROUTINE below adaptive threshold
  # Rule: pattern 'tags.*' → ROUTINE (should NOT trigger adaptive threshold)
  # --------------------------------------------------------------------------
  s19-fail-on-category-pass:
