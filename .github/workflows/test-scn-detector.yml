            deletion_window_in_days = 30
            enable_key_rotation     = true
          }
          FIXTURE
          git add terraform/kms-key.tf
          git commit -m "test: baseline KMS key"

          git rm terraform/kms-key.tf
          git commit -m "test: delete KMS key"

      - name: Run SCN detector
        id: scn
        uses: huntridge-labs/argus/.github/actions/scn-detector@sully/mcn-prototype
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
